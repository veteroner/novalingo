// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'com.google.gms:google-services:4.4.3'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

// exFAT sürücülerde macOS her yazılan dosya için `._*` AppleDouble ikizi üretir;
// R8 bunları sınıf dosyası sanıp `Invalid classfile header` ile düşer.
// Build çıktısı APFS'teki bir dizine alınabilir:
//   - terminal: NOVALINGO_ANDROID_BUILD_DIR ortam değişkeni
//   - Android Studio (terminal ortamını görmez): android/local.properties içinde
//     novalingo.androidBuildDir=/Users/<kullanıcı>/.novalingo-android-build
// İkisi de tanımsızsa (CI/Linux) davranış değişmez.
def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { localProperties.load(it) }
}
def externalBuildDir = System.getenv("NOVALINGO_ANDROID_BUILD_DIR") ?: localProperties.getProperty("novalingo.androidBuildDir")
if (externalBuildDir != null && !externalBuildDir.isEmpty()) {
    allprojects {
        layout.buildDirectory.set(new File(externalBuildDir, project.path.replace(':', '_')))
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
